name: ADUM Release

# Every push to a release+* branch (release+adum10 and its feature branches)
# builds three unsigned artifacts: Linux AppImage, Windows x64 MSI and macOS
# arm64 DMG. The name carries the package.json version and the commit.
on:
  push:
    branches:
      - 'release\+*'

# A newer push to the same branch supersedes a build that is still running
concurrency:
  group: adum-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from package.json and commit
        id: version
        run: |
          echo "version=$(node -p "require('./package.json').version")-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  linux-appimage:
    needs: version
    runs-on: ubuntu-24.04
    env:
      ARTIFACT: INAV-Configurator-ADUM_${{ needs.version.outputs.version }}_linux_x64.AppImage
    steps:
      - uses: actions/checkout@v4
      - name: Build AppImage
        run: ./docker/dev.sh appimage
      - name: Name AppImage
        run: mv out/*.AppImage "out/$ARTIFACT"
      # archive: false uploads the file itself, so it downloads as the .AppImage rather than a zip
      - uses: actions/upload-artifact@v7
        with:
          path: ./out/${{ env.ARTIFACT }}
          archive: false
          if-no-files-found: error

  windows-x64:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: engineerd/configurator@v0.0.10
        with:
          name: "Wix Toolset 3.1.4"
          url: "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          pathInArchive: "/"
      - name: Install deps
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_on: error
          command: yarn install --foreground-scripts
          timeout_minutes: 10
          on_retry_command: rm -rfv node_modules
      - name: Build Windows x64
        run: yarn run make -- --arch="x64"
      - uses: actions/upload-artifact@v4
        with:
          name: inav-configurator_adum-${{ needs.version.outputs.version }}_Windows64_MSI
          path: ./out/make/wix/x64/*.msi
          if-no-files-found: error

  macos-arm64:
    needs: version
    runs-on: macos-15
    env:
      ARTIFACT: INAV-Configurator-ADUM_${{ needs.version.outputs.version }}_MacOS_arm64.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Workaround due to a bug in node-gyp: https://github.com/electron/rebuild/issues/1116
      - name: Install Setuptools
        run: python3 -m pip install --break-system-packages setuptools
      - name: Install deps
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_on: error
          command: yarn install --foreground-scripts
          timeout_minutes: 10
          on_retry_command: rm -rfv node_modules
      - name: Build macOS arm64
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        with:
          max_attempts: 3
          retry_on: error
          timeout_minutes: 20
          command: |
            sudo mdutil -a -i off || true
            hdiutil detach "/Volumes/INAV-Configurator" -force 2>/dev/null || true
            yarn run make -- --arch="arm64"
      - name: Name DMG
        run: mv out/make/*arm64*.dmg "out/make/$ARTIFACT"
      - uses: actions/upload-artifact@v7
        with:
          path: ./out/make/${{ env.ARTIFACT }}
          archive: false
          if-no-files-found: error
