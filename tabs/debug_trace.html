<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Debug Trace</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        display: flex;
        flex-direction: column;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        font-size: 12px;
        color: #303030;
        background-color: #3d3f3e;
    }
    .titlebar {
        display: flex;
        align-items: center;
        gap: 1em;
        padding: 0.5em 0.8em;
        background-color: #e4e4e4;
        border-bottom: 1px solid #c8c8c8;
    }
    .titlebar .title { font-weight: bold; font-size: 1.1em; flex: 1; }
    .titlebar .state { color: #686868; }
    button {
        padding: 0.3em 0.9em;
        font: inherit;
        color: #fff;
        background-color: #37a8db;
        border: 0;
        border-radius: 3px;
        cursor: pointer;
    }
    button:hover { background-color: #2f93c0; }
    .settings {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.6em 1.2em;
        padding: 0.6em 0.8em;
        background-color: #f9f9f9;
        border-bottom: 1px solid #c8c8c8;
    }
    .settings .group { display: flex; align-items: center; gap: 0.5em; }
    .settings .group > label.name { font-weight: bold; }
    .settings .radio { display: inline-flex; align-items: center; gap: 0.25em; }
    .settings select, .settings .topics-button {
        padding: 0.25em 0.5em;
        font: inherit;
        color: #303030;
        background-color: #fff;
        border: 1px solid #c8c8c8;
        border-radius: 3px;
    }
    .disabled { opacity: 0.5; pointer-events: none; }
    button:disabled { opacity: 0.5; cursor: default; }
    .topics { position: relative; }
    .topics-button { cursor: pointer; }
    .topics-panel {
        display: none;
        position: absolute;
        z-index: 10;
        top: 100%;
        left: 0;
        margin-top: 2px;
        padding: 0.4em 0.7em;
        background-color: #fff;
        border: 1px solid #c8c8c8;
        border-radius: 3px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        white-space: nowrap;
    }
    .topics-panel.open { display: block; }
    .topics-panel label { display: flex; align-items: center; gap: 0.4em; padding: 0.15em 0; }
    .settings .note { flex-basis: 100%; color: #686868; }
    .settings .note.error { color: #c00000; }
    .settings button.save { margin-left: auto; }
    #debug-trace {
        flex: 1;
        overflow-y: auto;
        padding: 0.6em 0.8em;
        font-family: 'DejaVu Sans Mono', Menlo, Consolas, monospace;
        font-size: 1.05em;
        line-height: 1.45;
        color: #e6e6e6;
        background-color: #1e1f1e;
    }
    #debug-trace .line { white-space: pre-wrap; word-break: break-all; }
    #debug-trace .session {
        margin: 0.8em 0 0.4em;
        padding: 0.25em 0.6em;
        color: #1e1f1e;
        background-color: #ffb200;
        border-radius: 3px;
        font-weight: bold;
    }
    #debug-trace .empty { color: #8a8a8a; font-style: italic; }
</style>
</head>
<body>
    <div class="titlebar">
        <div class="title">Debug Trace</div>
        <div class="state" id="trace-state"></div>
        <button id="trace-clear" type="button" data-msg="debugLogClear">Clear</button>
    </div>
    <div class="settings" id="log-settings">
        <div class="group">
            <label class="name" data-msg="debugLogEnable">Logging</label>
            <label class="radio"><input type="radio" name="log-enabled" id="log-off" value="0"><span data-msg="debugLogOff">Off</span></label>
            <label class="radio"><input type="radio" name="log-enabled" id="log-on" value="1"><span data-msg="debugLogOn">On</span></label>
        </div>
        <div class="group" id="log-options">
            <label class="name" for="log-level" data-msg="debugLogLevel">Level</label>
            <select id="log-level"></select>
            <label class="name" data-msg="debugLogTopics">Topics</label>
            <div class="topics">
                <button class="topics-button" id="topics-button" type="button"></button>
                <div class="topics-panel" id="topics-panel"></div>
            </div>
        </div>
        <button class="save" id="log-save" type="button" data-msg="debugLogSave">Save</button>
        <div class="note" id="log-note"></div>
    </div>
    <div id="debug-trace"></div>
</body>
</html>
